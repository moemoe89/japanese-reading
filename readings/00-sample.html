<h2>サンプル：新しい習慣を続けるには</h2>
<p>
新しい<ruby>習慣<rt>しゅうかん</rt></ruby>を始めても、
数日でやめてしまう人は少なくない。
最初から大きな<ruby>目標<rt>もくひょう</rt></ruby>を立てるより、
毎日少しずつ続けられる方法を考えることが大切だ。
</p>
